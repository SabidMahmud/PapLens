apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paplens-prod
  namespace: flux-system
  labels:
    app.kubernetes.io/name: paplens
spec:
  interval: 10m0s
  targetNamespace: paplens
  sourceRef:
    kind: GitRepository
    name: paplens
  path: ./deploy/k8s/overlays/prod
  prune: true
  wait: true
  timeout: 3m0s
