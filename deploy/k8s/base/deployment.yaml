apiVersion: apps/v1
kind: Deployment
metadata:
  name: paplens-backend
  namespace: paplens
  labels:
    app.kubernetes.io/name: paplens-backend
    app.kubernetes.io/component: inference-api
    app.kubernetes.io/part-of: paplens
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: paplens-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paplens-backend
        app.kubernetes.io/component: inference-api
        app.kubernetes.io/part-of: paplens
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: ghcr.io/sabidmahmud/paplens-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7860
              protocol: TCP
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: paplens-config
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: paplens-secrets
                  key: HF_TOKEN
                  optional: true
          resources:
            requests:
              cpu: "1000m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: weights-volume
              mountPath: /app/weights
            - name: cache-volume
              mountPath: /home/appuser/.cache
      volumes:
        - name: tmp-volume
          emptyDir: {}
        - name: weights-volume
          emptyDir: {}
        - name: cache-volume
          emptyDir: {}
