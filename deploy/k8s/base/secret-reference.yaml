# Secret Reference & Template for PapLens Backend
# DO NOT COMMIT REAL TOKENS OR SECRETS TO GIT.
#
# To create this secret in your k3s cluster manually or via SealedSecrets / ExternalSecrets:
#
#   kubectl -n paplens create secret generic paplens-secrets \
#     --from-literal=HF_TOKEN="hf_your_actual_token_here"
#
apiVersion: v1
kind: Secret
metadata:
  name: paplens-secrets
  namespace: paplens
  labels:
    app.kubernetes.io/name: paplens-backend
    app.kubernetes.io/component: inference-api
type: Opaque
stringData:
  # Placeholder reference: Replace with your actual Hugging Face User Access Token (read permissions)
  # This is optional if your model weights repository on Hugging Face Hub is public.
  HF_TOKEN: "CHANGE_ME_BEFORE_APPLYING"
